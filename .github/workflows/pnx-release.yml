name: PNX Plugin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect build system
        id: detect
        run: |
          if [ -f "pom.xml" ]; then
            echo "build=maven" >> $GITHUB_OUTPUT
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "build=gradle" >> $GITHUB_OUTPUT
          elif [ -f "plugin.yml" ]; then
            echo "build=standalone" >> $GITHUB_OUTPUT
          else
            echo "build=none" >> $GITHUB_OUTPUT
            echo "No build system detected"
            exit 1
          fi

      - name: Build with Maven
        if: steps.detect.outputs.build == 'maven'
        run: mvn package -DskipTests

      - name: Build with Gradle
        if: steps.detect.outputs.build == 'gradle'
        run: ./gradlew build -x test --no-daemon

      - name: Find JAR file
        id: jar
        shell: bash
        run: |
          JAR=$(find . -name "*.jar" -not -path "*/target/*/original-*.jar" 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "No JAR found"
            exit 1
          fi
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT

      - name: Extract version from plugin.yml
        id: version
        shell: bash
        run: |
          if [ -f "plugin.yml" ]; then
            VERSION=$(grep -E "^version:" plugin.yml | cut -d: -f2 | tr -d ' ')
            if [ -z "$VERSION" ]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "${ steps.jar.outputs.jar_path }"
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
